# Run the Stallo API on its own:   docker compose up --build
# Needs a .env next to this file (copy .env.example and set DJANGO_SECRET_KEY).
services:
  api:
    build: .
    image: stallo-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (any long random string)}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - stallo-data:/data   # the SQLite database lives here, so orders survive restarts
    restart: unless-stopped

volumes:
  stallo-data:
